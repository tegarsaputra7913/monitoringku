<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Status OLT Down Stasiun</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Flatpickr Date Picker CSS (Dark Theme) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">

  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background-color: #0b1329; color: #f8fafc; padding: 24px; min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .title-group h1 { font-size: 24px; font-weight: 700; color: #ffffff; }
    .title-group p { font-size: 14px; color: #94a3b8; margin-top: 4px; }
    
    .status-badge { background: #182238; border: 1px solid #2e3d5c; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } }

    /* Panel Filter Grid */
    .filter-card { background: #182238; border: 1px solid #2e3d5c; border-radius: 12px; padding: 20px; margin-bottom: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: end; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label { font-size: 11px; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-control { background: #0b1329; border: 1px solid #2e3d5c; color: #f8fafc; padding: 10px 14px; border-radius: 8px; font-size: 13px; outline: none; transition: border-color 0.2s; cursor: pointer; }
    .filter-control:focus { border-color: #38bdf8; }
    
    .btn-reset { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; height: 40px; }
    .btn-reset:hover { background: rgba(239, 68, 68, 0.3); }

    .table-container { background: #182238; border: 1px solid #2e3d5c; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background-color: #0f172a; color: #94a3b8; font-weight: 600; padding: 16px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; border-bottom: 1px solid #2e3d5c; white-space: nowrap; }
    td { padding: 14px 16px; border-bottom: 1px solid #2e3d5c; color: #cbd5e1; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #1f2d4a; }

    .stasiun-tag { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 700; padding: 4px 10px; border-radius: 6px; display: inline-block; white-space: nowrap; }
    .ip-code { font-family: monospace; background: #0f172a; padding: 4px 8px; border-radius: 4px; color: #38bdf8; border: 1px solid #1e293b; }
    .brand-tag { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 11px; }

    .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-block; text-align: center; }
    .badge-down { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-progress { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-resolved { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }

    .last-update { font-size: 12px; color: #64748b; text-align: right; margin-top: 16px; }

    .flatpickr-calendar { background: #182238 !important; border: 1px solid #2e3d5c !important; box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important; }
    .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange { background: #38bdf8 !important; border-color: #38bdf8 !important; color: #0b1329 !important; font-weight: bold; }
    .flatpickr-day.inRange { background: rgba(56, 189, 248, 0.2) !important; box-shadow: -5px 0 0 rgba(56, 189, 248, 0.2), 5px 0 0 rgba(56, 189, 248, 0.2) !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>Monitoring Status OLT Down</h1>
        <p>Sistem Pemantauan Gangguan OLT Stasiun Real-Time</p>
      </div>
      <div class="status-badge">
        <span class="dot"></span>
        <span id="sync-status">Live Sync (10s)</span>
      </div>
    </div>

    <!-- Panel Filter -->
    <div class="filter-card">
      <div class="filter-group">
        <label>Cari Kata Kunci</label>
        <input type="text" id="search-input" class="filter-control" placeholder="Cari IP, Hostname, Problem..." oninput="terapkanFilter()">
      </div>

      <div class="filter-group">
        <label>Pilih Stasiun</label>
        <select id="filter-stasiun" class="filter-control" onchange="terapkanFilter()">
          <option value="">Semua Stasiun</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Filter Rentang Tanggal</label>
        <input type="text" id="filter-date-range" class="filter-control" placeholder="Pilih Tanggal / Rentang..." readonly>
      </div>

      <div class="filter-group">
        <label>Category</label>
        <select id="filter-category" class="filter-control" onchange="terapkanFilter()">
          <option value="">Semua Category</option>
        </select>
      </div>

      <div class="filter-group">
        <button class="btn-reset" onclick="resetFilter()">Reset Filter</button>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="table-container">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>NO</th>
              <th>STASIUN</th>
              <th>BRAND OLT</th>
              <th>HOSTNAME</th>
              <th>IP OLT</th>
              <th>CATEGORY</th>
              <th>TANGGAL</th>
              <th>WAKTU DOWN</th>
              <th>PROBLEM</th>
              <th>ACTION</th>
              <th>STATUS</th>
            </tr>
          </thead>
          <tbody id="isi-tabel">
            <tr>
              <td colspan="11" style="text-align: center; padding: 40px; color: #94a3b8;">
                Menghubungkan ke Google Sheets...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="last-update" id="waktu-update">Terakhir Diperbarui: -</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    const SPREADSHEET_ID = "1ALrR_In0bq_9fBM-irHLsSKO7sCq0r7_MaFZ70mdStY";
    const GID = "676156381";
    const FETCH_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

    let mappedData = [];
    let fpInstance = null;
    let selectedStartDate = null;
    let selectedEndDate = null;

    document.addEventListener("DOMContentLoaded", function() {
      fpInstance = flatpickr("#filter-date-range", {
        mode: "range",
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "d M Y",
        placeholder: "Pilih Rentang Tanggal...",
        onChange: function(selectedDates) {
          if (selectedDates.length === 1) {
            selectedStartDate = setZeroTime(selectedDates[0]);
            selectedEndDate = setZeroTime(selectedDates[0]);
          } else if (selectedDates.length === 2) {
            selectedStartDate = setZeroTime(selectedDates[0]);
            selectedEndDate = setZeroTime(selectedDates[1]);
          } else {
            selectedStartDate = null;
            selectedEndDate = null;
          }
          terapkanFilter();
        }
      });
    });

    function setZeroTime(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    async function ambilData() {
      try {
        const respon = await fetch(FETCH_URL);
        const teks = await respon.text();
        const baris = parseCSV(teks);

        if (baris.length < 2) return;

        // 1. Cari Baris Header yang BENAR (Baris yang mengandung nama kolom utama)
        let headerRowIndex = 0;
        for (let i = 0; i < Math.min(baris.length, 5); i++) {
          const checkLine = baris[i].map(c => c.toUpperCase());
          if (checkLine.some(c => c.includes("STASIUN") || c.includes("BRAND") || c.includes("CATEGORY") || c.includes("TANGGAL"))) {
            headerRowIndex = i;
            break;
          }
        }

        const headers = baris[headerRowIndex].map(h => h.trim().toUpperCase());

        // 2. Petakan Indeks Kolom
        const mapIdx = {
          stasiun: headers.findIndex(h => h.includes("STASIUN") || h.includes("LOKASI")),
          brand: headers.findIndex(h => h.includes("BRAND") || h.includes("MERK") || h.includes("VENDOR")),
          hostname: headers.findIndex(h => h.includes("HOST")),
          ip: headers.findIndex(h => h.includes("IP")),
          category: headers.findIndex(h => h.includes("CAT") || h.includes("KATEGORI")),
          tanggal: headers.findIndex(h => h.includes("TGL") || h.includes("TANGGAL") || h.includes("DATE")),
          waktu: headers.findIndex(h => h.includes("WAKTU") || h.includes("JAM") || h.includes("TIME")),
          problem: headers.findIndex(h => h.includes("PROB") || h.includes("MASALAH") || h.includes("GANGGUAN")),
          action: headers.findIndex(h => h.includes("ACT") || h.includes("PENANGANAN") || h.includes("SOLUSI")),
          status: headers.findIndex(h => h.includes("STAT"))
        };

        // Fallback jika header stasiun tidak ketemu
        if (mapIdx.stasiun === -1) {
          for (let col = 0; col < headers.length; col++) {
            if (baris.slice(headerRowIndex + 1, headerRowIndex + 10).some(b => (b[col] || '').toUpperCase().startsWith("ST."))) {
              mapIdx.stasiun = col;
              break;
            }
          }
        }

        // 3. Olah Isi Data
        mappedData = baris.slice(headerRowIndex + 1)
          .filter(b => b.some(c => c.trim() !== ''))
          .map(b => {
            const rawStasiun = (mapIdx.stasiun !== -1 && b[mapIdx.stasiun]) ? b[mapIdx.stasiun].trim() : '-';
            const rawTgl = (mapIdx.tanggal !== -1 && b[mapIdx.tanggal]) ? b[mapIdx.tanggal].trim() : '-';
            
            // Validasi apakah rawTgl benar-benar format tanggal
            const parsedObjDate = parseStringDate(rawTgl);

            return {
              stasiun: rawStasiun,
              brand: (mapIdx.brand !== -1 && b[mapIdx.brand]) ? b[mapIdx.brand].trim() : '-',
              hostname: (mapIdx.hostname !== -1 && b[mapIdx.hostname]) ? b[mapIdx.hostname].trim() : '-',
              ip: (mapIdx.ip !== -1 && b[mapIdx.ip]) ? b[mapIdx.ip].trim() : '-',
              category: (mapIdx.category !== -1 && b[mapIdx.category]) ? b[mapIdx.category].trim() : '-',
              tanggal: parsedObjDate ? rawTgl : '-', // Jika bukan tanggal valid, ganti '-'
              dateObj: parsedObjDate,
              waktu: (mapIdx.waktu !== -1 && b[mapIdx.waktu]) ? b[mapIdx.waktu].trim() : '-',
              problem: (mapIdx.problem !== -1 && b[mapIdx.problem]) ? b[mapIdx.problem].trim() : '-',
              action: (mapIdx.action !== -1 && b[mapIdx.action]) ? b[mapIdx.action].trim() : '-',
              status: (mapIdx.status !== -1 && b[mapIdx.status]) ? b[mapIdx.status].trim() : 'DOWN'
            };
          })
          .filter(item => item.stasiun !== '-' || item.problem !== '-'); // Buang baris sampah/kosong

        updateDropdowns();
        terapkanFilter();

        const skrg = new Date().toLocaleTimeString('id-ID');
        document.getElementById("waktu-update").innerText = "Terakhir Diperbarui: " + skrg;

      } catch (err) {
        console.error("Gagal narik data:", err);
      }
    }

    // Parser Tanggal yang Ketat
    function parseStringDate(str) {
      if (!str || str === '-' || str.length > 25) return null;

      // Cek pattern '01-Nov-25' / '01-Nov-2025'
      const partsDash = str.split('-');
      if (partsDash.length === 3) {
        const day = parseInt(partsDash[0], 10);
        const monthStr = partsDash[1];
        let year = parseInt(partsDash[2], 10);
        if (!isNaN(day) && !isNaN(year)) {
          if (year < 100) year += 2000;
          const monthMap = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
          const month = monthMap[monthStr.toLowerCase().substring(0,3)];
          if (month !== undefined) {
            return new Date(year, month, day);
          }
        }
      }

      // Cek pattern standard 'YYYY-MM-DD' atau 'MM/DD/YYYY'
      const d = new Date(str);
      if (!isNaN(d.getTime()) && d.getFullYear() > 2000 && d.getFullYear() < 2100) {
        d.setHours(0,0,0,0);
        return d;
      }

      return null;
    }

    function updateDropdowns() {
      const selectStasiun = document.getElementById("filter-stasiun");
      const selectCategory = document.getElementById("filter-category");

      const currentStasiun = selectStasiun.value;
      const currentCategory = selectCategory.value;

      const stasiunUnik = [...new Set(mappedData.map(d => d.stasiun).filter(s => s !== '-' && s !== ''))].sort();
      selectStasiun.innerHTML = '<option value="">Semua Stasiun (' + stasiunUnik.length + ')</option>' + 
        stasiunUnik.map(s => `<option value="${s}" ${s === currentStasiun ? 'selected' : ''}>${s}</option>`).join('');

      const categoryUnik = [...new Set(mappedData.map(d => d.category).filter(c => c !== '-' && c !== ''))].sort();
      selectCategory.innerHTML = '<option value="">Semua Category</option>' + 
        categoryUnik.map(c => `<option value="${c}" ${c === currentCategory ? 'selected' : ''}>${c}</option>`).join('');
    }

    function terapkanFilter() {
      const kw = document.getElementById("search-input").value.toLowerCase();
      const stasiun = document.getElementById("filter-stasiun").value;
      const category = document.getElementById("filter-category").value;

      const hasil = mappedData.filter(item => {
        const cocokKw = Object.values(item).some(v => typeof v === 'string' && v.toLowerCase().includes(kw));
        const cocokStasiun = !stasiun || item.stasiun === stasiun;
        const cocokCategory = !category || item.category === category;

        let cocokTanggal = true;
        if (selectedStartDate && selectedEndDate) {
          if (item.dateObj) {
            cocokTanggal = item.dateObj >= selectedStartDate && item.dateObj <= selectedEndDate;
          } else {
            cocokTanggal = false; // Jika di-filter tanggal, sembunyikan baris yang tidak punya tanggal valid
          }
        }

        return cocokKw && cocokStasiun && cocokCategory && cocokTanggal;
      });

      renderTabel(hasil);
    }

    function resetFilter() {
      document.getElementById("search-input").value = "";
      document.getElementById("filter-stasiun").value = "";
      document.getElementById("filter-category").value = "";
      
      if (fpInstance) {
        fpInstance.clear();
      }
      selectedStartDate = null;
      selectedEndDate = null;

      terapkanFilter();
    }

    function renderTabel(data) {
      const tbody = document.getElementById("isi-tabel");

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" style="text-align: center; padding: 30px; color: #94a3b8;">Tidak ada data OLT yang cocok dengan filter.</td></tr>`;
        return;
      }

      let html = '';
      data.forEach((item, idx) => {
        let statusBadge = `<span class="badge badge-down">${item.status}</span>`;
        if (/progress|penanganan/i.test(item.status)) {
          statusBadge = `<span class="badge badge-progress">${item.status}</span>`;
        } else if (/resolved|clear|up|selesai/i.test(item.status)) {
          statusBadge = `<span class="badge badge-resolved">${item.status}</span>`;
        }

        html += `<tr>
          <td>${idx + 1}</td>
          <td><span class="stasiun-tag">${item.stasiun}</span></td>
          <td><span class="brand-tag">${item.brand}</span></td>
          <td><b>${item.hostname}</b></td>
          <td><span class="ip-code">${item.ip}</span></td>
          <td>${item.category}</td>
          <td><b>${item.tanggal}</b></td>
          <td>${item.waktu}</td>
          <td>${item.problem}</td>
          <td>${item.action}</td>
          <td>${statusBadge}</td>
        </tr>`;
      });

      tbody.innerHTML = html;
    }

    function parseCSV(text) {
      let lines = text.split('\n');
      return lines.map(line => {
        let regex = /(?:\"([^\"]*)\"|([^,]+))/g;
        let matches = [];
        let match;
        while ((match = regex.exec(line)) !== null) {
          matches.push((match[1] || match[2] || '').trim().replace(/^"|"$/g, ''));
        }
        return matches;
      });
    }

    ambilData();
    setInterval(ambilData, 10000);
  </script>

</body>
</html>
